name: Keep the site fresh

on:
  schedule:
    # Sunday 23:59 Asia/Kolkata (18:29 UTC). GitHub schedules are UTC and can start a few minutes late.
    - cron: '29 18 * * 0'
  push:
    paths:
      - 'public/resume.pdf'
      - 'content/resume.pdf'
      - 'src/data/linkedin-posts.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public writing
        run: python3 scripts/refresh-writing.py
      - name: Publish a résumé committed under content
        run: |
          if [ -f content/resume.pdf ]; then
            mkdir -p public
            cp content/resume.pdf public/resume.pdf
          fi
      - name: Commit the refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/public-writing.json public/resume.pdf
          if git diff --cached --quiet; then
            echo "No writing or résumé changes."
          else
            git commit -m "Refresh public writing and résumé."
            git push
          fi
